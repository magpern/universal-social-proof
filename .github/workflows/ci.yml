name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: Lint, PHPCS, and M4 policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci
      - run: composer phpcs
      - run: composer test:js

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-
      - run: composer install --no-interaction --prefer-dist
      - run: composer test:unit

  integration:
    name: Integration (PHP 8.3 / WC 11.0.1)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      WP_DB_HOST: 127.0.0.1
      WP_DB_NAME: wordpress_test
      WP_DB_USER: root
      WP_DB_PASS: root
      WC_VERSION: '11.0.1'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        id: setup-php
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none
      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ steps.setup-php.outputs.php-version }}-
      - run: composer install --no-interaction --prefer-dist
      - run: sudo apt-get update && sudo apt-get install -y unzip
      - run: bash tests/bin/install-wp.sh
      - run: composer test:integration
