name: Release

# Publishes a GitHub Release when an exact version tag is pushed. Per
# docs/adr/0013-version-release-policy.md the plugin header, USP_VERSION and
# CHANGELOG.md must agree on the tagged commit; this workflow enforces that
# before publishing. Tags are cut from `main` after CI is green and must be
# annotated (git tag -a). Checkout peels annotated tags to the release commit.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@v7
        with:
          # Annotated tags: checkout peels to <tag>^{} (commit/tree). Do not treat
          # the tag-object SHA as the release commit.
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Require annotated release tag
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if ! git rev-parse "$tag_ref" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          fi
          tag_type="$(git cat-file -t "$tag_ref")"
          if [ "$tag_type" != "tag" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must be annotated (ADR-0013 / docs/RELEASE.md). Lightweight tags are rejected for new releases. Historical exception: published v0.4.1 remains immutable and is not republished."
            exit 1
          fi
          peeled="$(git rev-parse "${GITHUB_REF_NAME}^{}")"
          echo "Annotated tag ${GITHUB_REF_NAME} (object $(git rev-parse "$tag_ref")) peels to commit ${peeled}"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: composer install --no-interaction --prefer-dist

      - name: Required quality gates
        run: |
          composer ci
          composer phpcs
          composer test:js
          composer test:unit

      - name: Build the release package for the tag version
        run: bash scripts/build-release-package.sh "${GITHUB_REF_NAME#v}"

      - name: Verify all version declarations match the Git tag
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          zip="dist/universal-social-proof-${tag_version}.zip"
          sum="${zip}.sha256"
          [ -s "$zip" ] || { echo "::error::missing $zip for tag ${GITHUB_REF_NAME}"; ls -la dist || true; exit 1; }
          [ -s "$sum" ] || { echo "::error::missing $sum"; exit 1; }
          ( cd dist && sha256sum -c "$(basename "$sum")" )
          header="$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([0-9A-Za-z.+-]+).*/\1/p' universal-social-proof.php | head -n1)"
          const="$(sed -nE "s/.*USP_VERSION',[[:space:]]*'([^']+)'.*/\1/p" universal-social-proof.php | head -n1)"
          [ "$header" = "$tag_version" ] || { echo "::error::plugin header ($header) != tag ($tag_version)"; exit 1; }
          [ "$const" = "$tag_version" ] || { echo "::error::USP_VERSION ($const) != tag ($tag_version)"; exit 1; }
          grep -qE "^## \[${tag_version//./\\.}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${tag_version}]' section"; exit 1; }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/universal-social-proof-*.zip
            dist/universal-social-proof-*.zip.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

      # TODO(private artifact server): a follow-up may add a step here mirroring
      # the ZIP + .sha256 to the internal artifact server, using a dedicated
      # secret (never GITHUB_TOKEN), running only after the Release is created.
      # Endpoint/protocol/secret are not defined for this repo yet.
